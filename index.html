<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cubica3D · Cotizador</title>
  <link rel="icon" type="image/png" href="icons/cubica-logo.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header__brand">
      <img class="app-header__logo-img" src="icons/cubica-logo.png" alt="Cubica3D" width="42" height="42" />
      <div>
        <h1 class="app-header__title">Cubica3D</h1>
        <p class="app-header__subtitle">Cotizador de impresión 3D</p>
      </div>
    </div>
    <nav class="tabs" id="tabs" role="tablist">
      <button class="tab" type="button" role="tab" data-route="productos">Productos</button>
      <button class="tab" type="button" role="tab" data-route="proceso">Proceso</button>
      <button class="tab" type="button" role="tab" data-route="estadisticas">Estadísticas</button>
    </nav>
    <div class="app-header__actions">
      <button class="cart-chip" type="button" id="cart-chip" title="Ir al carrito de cotización">
        <span class="cart-chip__icon" aria-hidden="true">🛒</span>
        <span class="cart-chip__count" id="cart-count">0</span>
        <span class="cart-chip__sep" aria-hidden="true">·</span>
        <span class="cart-chip__total" id="cart-total">$0.00</span>
      </button>
      <span class="user-chip" id="user-chip" hidden></span>
      <button class="icon-btn icon-btn--gear" type="button" id="btn-config"
        title="Configuración" aria-label="Configuración">⚙️</button>
    </div>
  </header>

  <!-- Aviso de arranque: acá NO se pide correo ni contraseña (no hay login). Al
       abrirse, la app le pide la sesión al API, que entra sola con la cuenta del
       taller (js/acceso.js + js/app.js la ocultan cuando entra bien). Esta
       pantalla sólo aparece si no pudo entrar, para decir por qué y reintentar. -->
  <section class="acceso" id="acceso" hidden aria-labelledby="acceso-titulo">
    <div class="acceso__card">
      <img class="acceso__logo" src="icons/cubica-logo.png" alt="" width="56" height="56" />
      <h2 class="acceso__title" id="acceso-titulo">Cotizador Cubica3D</h2>
      <p class="acceso__hint" id="acceso-mensaje">Entrando con la cuenta del taller…</p>
      <button class="btn btn--primary acceso__enviar" type="button" id="acceso-reintentar">Reintentar</button>
      <p class="acceso__error" id="acceso-error" hidden></p>
    </div>
  </section>

  <!-- El PIN: el cotizador no se abre hasta que los 4 dígitos estén bien. El PIN
       vive en el servidor (variable PIN del api/.env), así que acá no hay nada que
       comparar: se juntan los 4 dígitos y se mandan al API. Por eso NO hay botón de
       entrar: al cuarto dígito se verifica solo (js/pin.js). El «⌫» es para
       corregir un dígito antes de llegar al cuarto. -->
  <section class="acceso acceso--pin" id="pin" hidden aria-labelledby="pin-titulo">
    <div class="acceso__card">
      <img class="acceso__logo" src="icons/cubica-logo.png" alt="" width="56" height="56" />
      <h2 class="acceso__title" id="pin-titulo">Cotizador Cubica3D</h2>
      <p class="acceso__hint">Escribí el PIN de 4 dígitos para entrar.</p>

      <div class="pin__puntos" id="pin-puntos" role="status" aria-live="polite"
        aria-label="Dígitos del PIN escritos">
        <span class="pin__punto" data-punto="1"></span>
        <span class="pin__punto" data-punto="2"></span>
        <span class="pin__punto" data-punto="3"></span>
        <span class="pin__punto" data-punto="4"></span>
      </div>

      <div class="pin__teclas" id="pin-teclas" role="group" aria-label="Teclado del PIN">
        <button class="pin__tecla" type="button" data-digito="1">1</button>
        <button class="pin__tecla" type="button" data-digito="2">2</button>
        <button class="pin__tecla" type="button" data-digito="3">3</button>
        <button class="pin__tecla" type="button" data-digito="4">4</button>
        <button class="pin__tecla" type="button" data-digito="5">5</button>
        <button class="pin__tecla" type="button" data-digito="6">6</button>
        <button class="pin__tecla" type="button" data-digito="7">7</button>
        <button class="pin__tecla" type="button" data-digito="8">8</button>
        <button class="pin__tecla" type="button" data-digito="9">9</button>
        <button class="pin__tecla pin__tecla--borrar" type="button" data-borrar="1"
          aria-label="Borrar el último dígito">⌫</button>
        <button class="pin__tecla" type="button" data-digito="0">0</button>
        <span class="pin__tecla pin__tecla--hueco" aria-hidden="true"></span>
      </div>

      <p class="acceso__error" id="pin-error" hidden></p>
    </div>
  </section>

  <main class="app-main" id="view"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Motor de impresión: PDF.imprimir() dibuja aquí la hoja A4 (fuera de la
       pantalla) para que el PDF salga igual desde cualquier pestaña. -->
  <div id="print-root" aria-hidden="true"></div>

  <!-- Orden importante: utils -> api -> store -> clicer -> cart -> proceso -> pdf
       -> acceso -> pin -> vistas -> app (clicer.js = producto «Clicker de Nombre»,
       pin.js = la pantalla del PIN de entrada) -->
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/clicer.js"></script>
  <script src="js/po.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/proceso.js"></script>
  <script src="js/estadisticas.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/acceso.js"></script>
  <script src="js/pin.js"></script>
  <script src="js/views/productos.js"></script>
  <script src="js/views/carrito.js"></script>
  <script src="js/views/proceso.js"></script>
  <script src="js/views/estadisticas.js"></script>
  <script src="js/views/configuracion.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
