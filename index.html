<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cubica3D · Cotizador</title>
  <link rel="icon" type="image/png" href="icons/cubica-logo.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header__brand">
      <img class="app-header__logo-img" src="icons/cubica-logo.png" alt="Cubica3D" width="42" height="42" />
      <div>
        <h1 class="app-header__title">Cubica3D</h1>
        <p class="app-header__subtitle">Cotizador de impresión 3D</p>
      </div>
    </div>
    <nav class="tabs" id="tabs" role="tablist">
      <button class="tab" type="button" role="tab" data-route="productos">Productos</button>
      <button class="tab" type="button" role="tab" data-route="proceso">Proceso</button>
    </nav>
    <div class="app-header__actions">
      <button class="cart-chip" type="button" id="cart-chip" title="Ir al carrito de cotización">
        <span class="cart-chip__icon" aria-hidden="true">🛒</span>
        <span class="cart-chip__count" id="cart-count">0</span>
        <span class="cart-chip__sep" aria-hidden="true">·</span>
        <span class="cart-chip__total" id="cart-total">$0.00</span>
      </button>
      <span class="user-chip" id="user-chip" hidden></span>
      <button class="btn btn--ghost btn--salir" type="button" id="btn-salir">Salir</button>
      <button class="icon-btn icon-btn--gear" type="button" id="btn-config"
        title="Configuración" aria-label="Configuración">⚙️</button>
    </div>
  </header>

  <!-- Pantalla de acceso: todo el API pide sesión, así que hasta entrar no se
       pinta la app (js/acceso.js + js/app.js la ocultan cuando el login va bien). -->
  <section class="acceso" id="acceso" hidden aria-labelledby="acceso-titulo">
    <form class="acceso__card" id="acceso-form" novalidate>
      <img class="acceso__logo" src="icons/cubica-logo.png" alt="" width="56" height="56" />
      <h2 class="acceso__title" id="acceso-titulo">Entrar al cotizador</h2>
      <p class="acceso__hint">Las cotizaciones del taller viven en una base compartida:
        entra con tu cuenta para verlas, moverlas y sacar el PDF.</p>
      <label class="field">
        <span class="field__label">Correo</span>
        <input class="field__input" type="email" id="acceso-email" autocomplete="username"
          placeholder="tu@correo.com" required />
      </label>
      <label class="field">
        <span class="field__label">Contraseña</span>
        <input class="field__input" type="password" id="acceso-password"
          autocomplete="current-password" required />
      </label>
      <button class="btn btn--primary acceso__enviar" type="submit" id="acceso-boton">Entrar</button>
      <p class="acceso__error" id="acceso-error" hidden></p>
    </form>
  </section>

  <main class="app-main" id="view"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Motor de impresión: PDF.imprimir() dibuja aquí la hoja A4 (fuera de la
       pantalla) para que el PDF salga igual desde cualquier pestaña. -->
  <div id="print-root" aria-hidden="true"></div>

  <!-- Orden importante: utils -> api -> store -> cart -> proceso -> pdf -> acceso
       -> vistas -> app -->
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/proceso.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/acceso.js"></script>
  <script src="js/views/productos.js"></script>
  <script src="js/views/carrito.js"></script>
  <script src="js/views/proceso.js"></script>
  <script src="js/views/configuracion.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
